          echo "Phase 2 source unpacked."

      - name: Apply Phase 2 patches
        run: |
          python apply_patches.py
          rm -f apply_patches.py

      - name: Rebuild FDA corpus from openFDA
        run: |
          if [ "${{ inputs.fetch_pdfs }}" = "true" ]; then
            python tools/fetch_fda.py --pdfs
          else
            python tools/fetch_fda.py
          fi

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install pytest pyyaml

      - name: Run tests
        run: pytest tests/ -q

      - name: Build the fabric
        run: python -m pipeline.build_index

      - name: Retrieval evaluation
        run: python -m eval.evaluate --gate

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --cached -r --ignore-unmatch site/data >/dev/null 2>&1 || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Bootstrap Knowledge Fabric Phase 2" \
                       -m "Multi-source connector layer, LSA semantic retrieval, hybrid RRF fusion, typed cross-source knowledge graph, and a gated retrieval evaluation harness. FDA corpus regenerated from openFDA at build time."
            git push
            echo "Pushed."
          fi

      - name: Next steps
        run: |
          echo "===================================================="
          echo " Bootstrap complete."
          echo ""
          echo " 1. Delete .github/workflows/bootstrap.yml"
          echo " 2. Settings -> Pages -> Source: GitHub Actions"
          echo " 3. Actions -> Build and Deploy to GitHub Pages -> Run"
          echo "===================================================="
