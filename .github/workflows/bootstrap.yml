name: Bootstrap Knowledge Fabric (Phase 2)

# ============================================================================
# ONE-TIME SETUP. Run this once, then delete it.
#
# Assembles the full Phase 2 Knowledge Fabric into this repository:
#   1. clones the Phase 1 base from prashobh-ai/novabiomedical_demo (public)
#   2. unpacks the Phase 2 source carried in this file
#   3. patches the three Phase 1 site files that change
#   4. rebuilds the FDA corpus live from openFDA (nothing stale is carried)
#   5. runs tests + build + retrieval evaluation
#   6. commits everything back to this repo
#
# Uses the built-in GITHUB_TOKEN. No personal access token is required and no
# repository secret needs to be created.
#
# Run it:  Actions tab -> "Bootstrap Knowledge Fabric (Phase 2)" -> Run workflow
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Phase 1 repo to clone the site/pipeline base from"
        required: true
        default: "prashobh-ai/novabiomedical_demo"
      fetch_pdfs:
        description: "Also download FDA clearance PDFs (~23 MB)"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Phase 1 base
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.base_repo }}.git" /tmp/base
          find /tmp/base -path /tmp/base/.git -prune -o -type f -print | head -30

      - name: Import Phase 1 site and pipeline
        run: |
          mkdir -p site pipeline tests scripts docs_source
          cp -r /tmp/base/site/. site/
          cp -r /tmp/base/docs_source/. docs_source/ 2>/dev/null || true
          for f in parsers.py chunker.py bm25_index.py entities.py __init__.py; do
            cp "/tmp/base/pipeline/$f" pipeline/ 2>/dev/null || true
          done
          cp -r /tmp/base/scripts/. scripts/ 2>/dev/null || true
          cp /tmp/base/tests/__init__.py tests/ 2>/dev/null || touch tests/__init__.py
          rm -rf site/data
          echo "Imported $(find docs_source -name '*.pdf' | wc -l) source PDFs"

